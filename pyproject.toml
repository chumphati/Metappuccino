[project]
name = "metappuccino"
version = "1.0.0"
description = "Metappuccino CLI"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{name="Fiona Hak"}]
dependencies = ["numpy", "psutil", "rich", "requests", "pandas", "spacy", "scikit-learn",
  "nltk", "transformers", "torch", "openpyxl", "pyarrow", "fastparquet", "matplotlib", "peft",
  "sentence_transformers" , "datasets" , "tensorboard" , "sentencepiece"]

[tool.setuptools.packages.find]
where = ["."]
include = ["metappuccino*"]

[tool.setuptools.package-data]
metappuccino = [
  "bin/**/*.sh",
  "scripts/**/*.py",
  "data/**",
]

[tool.setuptools]
include-package-data = true

[project.scripts]
metappuccino = "metappuccino.bin.Metappuccino:main"

[build-system]
requires = ["setuptools>=68","wheel","build"]
build-backend = "setuptools.build_meta"
